<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #d35400;
            --accent: #f1c40f;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Glassmorphism & Layout */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .theme-toggle, .cart-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            background: radial-gradient(circle, rgba(230,126,34,0.15) 0%, rgba(15,23,42,0) 70%);
            margin-top: 60px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 1rem;
            font-weight: 900;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .cta-btn {
            background: var(--primary);
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* Chips Filter */
        .filters-container {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            padding: 1rem 5%;
            scrollbar-width: none;
        }
        .filters-container::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
        }

        .chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Menu Grid */
        .menu-section {
            padding: 2rem 5% 6rem 5%;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .menu-card {
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .menu-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .menu-card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .menu-card h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .menu-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .menu-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Bottom Sheet */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            background: var(--bg-color);
            width: 100%;
            max-width: 600px;
            border-radius: 24px 24px 0 0;
            padding: 2rem;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-color);
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-sheet {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        /* Floating Sticky Cart Bar */
        .sticky-cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary);
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            z-index: 1500;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sticky-cart-bar.visible {
            transform: translateX(-50%) translateY(0);
        }

        /* Cart & Checkout Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-color);
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
        }

        .form-group input[dir="ltr"] {
            direction: ltr;
            unicode-bidi: isolate;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #fff;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="glass">
        <div class="logo" id="restaurant-name">جاري التحميل...</div>
        <div class="nav-actions">
            <button class="theme-toggle" id="theme-toggle">🌙 الوضع</button>
            <button class="cart-btn" onclick="openCartModal()">🛒 السلة (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1 id="hero-title">أهلاً بك في مطعمنا</h1>
        <p id="hero-description">أشهى المأكولات الطازجة والمعدة بأعلى معايير الجودة العالمية.</p>
        <button class="cta-btn" onclick="scrollToMenu()">استعرض القائمة</button>
    </section>

    <!-- Category Chips Filter -->
    <div class="filters-container" id="filters-container">
        <button class="chip active" onclick="filterMenu('all')">الكل</button>
    </div>

    <!-- Menu Section -->
    <section class="menu-section">
        <div class="menu-grid" id="menu-grid">
            <!-- Items rendered dynamically -->
        </div>
    </section>

    <!-- Bottom Sheet for Customization -->
    <div class="bottom-sheet-overlay" id="bottom-sheet-overlay" onclick="closeBottomSheet(event)">
        <div class="bottom-sheet glass" id="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2 id="sheet-item-name">اسم الوجبة</h2>
                <button class="close-sheet" onclick="closeBottomSheet()">×</button>
            </div>
            <p id="sheet-item-desc" style="color: var(--text-muted); margin-bottom: 1rem;"></p>
            <div id="sheet-options"></div>
            <button class="btn-primary" id="add-to-cart-btn" onclick="confirmAddToCart()">إضافة إلى السلة</button>
        </div>
    </div>

    <!-- Floating Sticky Cart Bar -->
    <div class="sticky-cart-bar" id="sticky-cart-bar" onclick="openCartModal()">
        <div>
            <span id="sticky-item-count">0</span> عناصر في السلة
        </div>
        <div id="sticky-total-price" style="font-weight: bold;">0</div>
    </div>

    <!-- Cart & Checkout Modal -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content glass">
            <div class="sheet-header">
                <h2>سلة المشتريات والطلب</h2>
                <button class="close-sheet" onclick="closeCartModal()">×</button>
            </div>
            <div id="cart-items-list" style="margin-bottom: 1.5rem; max-height: 200px; overflow-y: auto;">
                <!-- Cart items -->
            </div>
            <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem;">
                <span>المجموع الكلي:</span>
                <span id="cart-modal-total">0</span>
            </div>

            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="cust-name" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="cust-phone" dir="ltr" placeholder="+249XXXXXXXXX">
            </div>
            <div class="form-group">
                <label>عنوان التوصيل</label>
                <textarea id="cust-address" placeholder="المدينة، الحي، شارع..."></textarea>
            </div>

            <button class="btn-primary" id="checkout-btn" onclick="checkoutWhatsApp()" disabled>إتمام الطلب عبر واتساب</button>
            <button class="btn-primary btn-cancel" onclick="closeCartModal()">إلغاء وعودة للموقع</button>
        </div>
    </div>

    <script>
        let restaurantData = {};
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let activeCategory = 'all';
        let currentSelectedItem = null;

        // Fetch data.json
        async function init() {
            try {
                const response = await fetch('data.json');
                restaurantData = await response.json();
                renderWebsite();
            } catch (error) {
                console.error('Error loading data.json:', error);
                document.getElementById('restaurant-name').innerText = 'خطأ في تحميل البيانات';
            }
        }

        function renderWebsite() {
            const g = restaurantData.global;
            const r = restaurantData.restaurant;

            // Set Direction and Language
            document.documentElement.lang = g.language;
            document.documentElement.dir = g.textDirection;

            // Apply Theme Colors
            if(r.colors) {
                document.documentElement.style.setProperty('--primary', r.colors.primary);
                document.documentElement.style.setProperty('--secondary', r.colors.secondary);
                document.documentElement.style.setProperty('--accent', r.colors.accent);
            }

            // Header & Hero
            document.getElementById('restaurant-name').innerText = r.name;
            document.getElementById('hero-title').innerText = r.name;
            document.getElementById('hero-description').innerText = r.description;

            // Render Categories Chips & Menu
            renderFilters();
            renderMenu('all');
            updateCartUI();
        }

        function renderFilters() {
            const container = document.getElementById('filters-container');
            restaurantData.menu.categories.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `chip ${index === 0 ? '' : ''}`;
                btn.innerText = cat.name;
                btn.onclick = () => filterMenu(cat.name, btn);
                container.appendChild(btn);
            });
        }

        function filterMenu(categoryName, btnElement) {
            if(btnElement) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btnElement.classList.add('active');
            }
            activeCategory = categoryName;
            renderMenu(categoryName);
        }

        function renderMenu(categoryName) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';

            restaurantData.menu.categories.forEach(cat => {
                if (categoryName === 'all' || cat.name === categoryName) {
                    cat.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'menu-card glass';
                        card.onclick = () => openBottomSheet(item);
                        card.innerHTML = `
                            <img src="${item.image}" alt="${item.name}" loading="lazy">
                            <div class="menu-card-content">
                                <div>
                                    <h3>${item.name}</h3>
                                    <p>${item.description}</p>
                                </div>
                                <div class="menu-card-footer">
                                    <span class="price">${item.localPrice || item.price}</span>
                                    <button style="background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 10px; cursor: pointer;">اختيار</button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
            });
        }

        function openBottomSheet(item) {
            currentSelectedItem = item;
            document.getElementById('sheet-item-name').innerText = item.name;
            document.getElementById('sheet-item-desc').innerText = item.description;
            document.getElementById('bottom-sheet-overlay').classList.add('active');
        }

        function closeBottomSheet(e) {
            if(!e || e.target.id === 'bottom-sheet-overlay' || e.target.classList.contains('close-sheet')) {
                document.getElementById('bottom-sheet-overlay').classList.remove('active');
            }
        }

        function confirmAddToCart() {
            if (!currentSelectedItem) return;
            cart.push(currentSelectedItem);
            saveCart();
            closeBottomSheet();
            updateCartUI();
        }

        function updateCartUI() {
            localStorage.setItem('cart', JSON.stringify(cart));
            const count = cart.length;
            document.getElementById('cart-count').innerText = count;
            document.getElementById('sticky-item-count').innerText = count;

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const currencySymbol = restaurantData.global?.currency?.symbol || '';
            document.getElementById('sticky-total-price').innerText = `${total} ${currencySymbol}`;
            document.getElementById('cart-modal-total').innerText = `${total} ${currencySymbol}`;

            const bar = document.getElementById('sticky-cart-bar');
            if (count > 0) {
                bar.classList.add('visible');
                document.getElementById('checkout-btn').disabled = false;
            } else {
                bar.classList.remove('visible');
                document.getElementById('checkout-btn').disabled = true;
            }

            // Render Cart Modal Items
            const listContainer = document.getElementById('cart-items-list');
            listContainer.innerHTML = '';
            cart.forEach((item, index) => {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.style.marginBottom = '0.8rem';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <div>
                        <span style="margin-left: 1rem; color: var(--primary);">${item.localPrice || item.price}</span>
                        <button onclick="removeFromCart(${index})" style="background: #e74c3c; color: #fff; border: none; padding: 0.2rem 0.6rem; border-radius: 5px; cursor: pointer;">حذف</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function openCartModal() {
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function scrollToMenu() {
            window.scrollTo({ top: window.innerHeight * 0.7, behavior: 'smooth' });
        }

        function checkoutWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if(!name || !phone || !address) {
                alert('الرجاء إكمال كافة بيانات الاستلام والاتصال.');
                return;
            }

            let message = `طلب جديد من الموقع:%0A`;
            message += `الاسم: ${name}%0A`;
            message += `الهاتف: ${phone}%0A`;
            message += `العنوان: ${address}%0A%0A`;
            message += `الطلبات:%0A`;
            
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.localPrice || item.price}%0A`;
            });

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const currencySymbol = restaurantData.global?.currency?.symbol || '';
            message += `%0Aالمجموع الكلي: ${total} ${currencySymbol}`;

            const restaurantPhone = restaurantData.restaurant.phone.replace(/[^0-9]/g, '');
            const whatsappUrl = `https://wa.me/${restaurantPhone}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.onclick = () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerText = '🌙 الوضع';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.innerText = '☀️ الوضع';
            }
        };

        // Auto time-based theme
        const currentHour = new Date().getHours();
        if (currentHour < 6 || currentHour > 18) {
            // Keep Dark mode by default
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.innerText = '☀️ الوضع';
        }

        init();
    </script>
</body>
</html>
